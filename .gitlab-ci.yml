image: gcc

stages:
  - build
#  - build-128
  - test
#  - test-128

build:
  stage: build
  before_script:
  - DEBIAN_FRONTEND=noninteractive apt update
  - DEBIAN_FRONTEND=noninteractive apt -y install meson libginac-dev zlib1g-dev libyaml-cpp-dev libflint-dev
  script:
    - meson build
    - cd build
    - ninja -v
  artifacts:
    paths:
      - build
      - subprojects/firefly

