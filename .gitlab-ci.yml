test:
  stage: test
  before_script:
  - DEBIAN_FRONTEND=noninteractive apt update
  - DEBIAN_FRONTEND=noninteractive apt -y install meson libginac-dev zlib1g-dev libyaml-cpp-dev libflint-dev
  - wget https://home.bway.net/lewis/fermat64/ferl6.tar.gz
  - tar -xzf ferl6.tar.gz
  - export FERMATPATH="$(pwd)/ferl6/fer64"
  # make sure that the same version of libstdc++.so is used at compile time and at run time
  - export LD_LIBRARY_PATH="/usr/local/lib64:$LD_LIBRARY_PATH"
  script:
    - cd build
    # TODO: get rid of --no-rebuild
    - meson test -v --no-rebuild --suite kira
  artifacts:
    paths:
      - build/meson-logs/

