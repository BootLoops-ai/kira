integralfamilies:
  - name: "III"
    loop_momenta: [k1,k2]
    top_level_sectors: ["b111111100", "b011011111"]
    propagators:
      - [ "2*k1*u1" , 0 ]
      - [ "-2*k1*u2", 0 ]
      - [ "-2*k2*u1", 0 ]
      - [ "2*k2*u2" , 0 ]
      - [ "k1"      , 0 ]
      - [ "k2"      , 0 ]
      - [ "k1+k2-q" , 0 ]
      - [ "k1-q"    , 0 ]
      - [ "k2-q"    , 0 ]
  - name: "IX"
    loop_momenta: [k1,k2]
    top_level_sectors: ["b111111100"]
    propagators:
      - [ "2*k1*u1"      , 0 ]
      - [ "-2*k1*u2"     , 0 ]
      - [ "-2*k2*u1"     , 0 ]
      - [ "-2*(k1+k2)*u2", 0 ]
      - [ "k1"           , 0 ]
      - [ "k2"           , 0 ]
      - [ "k1+k2-q"      , 0 ]
      - [ "k1-q"         , 0 ]
      - [ "k2-q"         , 0 ]
